<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chats – Andik's</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#F5C800;--yd:#D4A900;--bk:#011041;--sw:260px;}
*{font-family:'Poppins',sans-serif;}body{background:#F4F5F7;margin:0;}

/* SIDEBAR */
.sidebar{width:var(--sw);min-height:100vh;background:var(--bk);position:fixed;top:0;left:0;display:flex;flex-direction:column;z-index:200;}
.sb-header{padding:1.2rem;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;}
.sb-logo{width:42px;height:42px;background:var(--y);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;color:var(--bk);flex-shrink:0;}
.sb-brand{color:var(--y);font-weight:700;font-size:.9rem;line-height:1.2;}
.sb-role{color:rgba(255,255,255,.4);font-size:.68rem;}
.sb-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.25);padding:.8rem 1.4rem .3rem;}
.sb-link{display:flex;align-items:center;gap:10px;padding:.58rem 1.4rem;color:rgba(255,255,255,.65);text-decoration:none;font-size:.86rem;font-weight:500;transition:.2s;border-left:3px solid transparent;}
.sb-link i{width:18px;text-align:center;}
.sb-link:hover{color:#fff;background:rgba(255,255,255,.06);}
.sb-link.active{color:var(--y);background:rgba(245,200,0,.08);border-left-color:var(--y);}
.sb-footer{padding:1rem 1.4rem;border-top:1px solid rgba(255,255,255,.08);margin-top:auto;}
.sb-badge{background:var(--y);color:var(--bk);font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:auto;}

/* MAIN */
.main{margin-left:var(--sw);display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:#fff;height:64px;display:flex;align-items:center;padding:0 1.5rem;border-bottom:1px solid #EBEBEB;position:sticky;top:0;z-index:100;gap:1rem;}
.topbar-title{font-weight:700;font-size:1.1rem;flex:1;}
.avatar{width:36px;height:36px;background:var(--y);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:var(--bk);}

/* CHAT LAYOUT */
.chat-container{display:flex;height:calc(100vh - 64px);overflow:hidden;}

/* CONTACTS */
.contacts-panel{width:320px;background:#fff;border-right:1px solid #EBEBEB;display:flex;flex-direction:column;flex-shrink:0;}
.contacts-header{padding:1rem 1.2rem;border-bottom:1px solid #EBEBEB;}
.contacts-search{border:1.5px solid #E0E0E0;border-radius:10px;padding:.5rem 1rem;font-size:.85rem;width:100%;outline:none;}
.contacts-search:focus{border-color:var(--y);}
.contacts-list{flex:1;overflow-y:auto;}
.contact-item{display:flex;align-items:center;gap:12px;padding:.9rem 1.2rem;cursor:pointer;border-bottom:1px solid #F5F5F5;transition:.2s;}
.contact-item:hover{background:#F8F8F8;}
.contact-item.active{background:#FFF9E0;border-left:3px solid var(--y);}
.contact-av{width:44px;height:44px;border-radius:50%;background:var(--bk);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;color:var(--y);flex-shrink:0;}
.contact-av.admin{background:var(--y);color:var(--bk);}
.contact-info{flex:1;min-width:0;}
.contact-name{font-weight:600;font-size:.88rem;color:#222;}
.contact-preview{font-size:.75rem;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.contact-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.contact-time{font-size:.68rem;color:#bbb;}
.unread-badge{background:var(--y);color:var(--bk);font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:20px;}
.role-tag{font-size:.68rem;font-weight:600;padding:1px 7px;border-radius:10px;}
.role-tag.admin{background:#EDE7F6;color:#6A1B9A;}
.role-tag.staff{background:#E8F5E9;color:#2E7D32;}

/* CHAT WINDOW */
.chat-panel{flex:1;display:flex;flex-direction:column;background:#F4F5F7;}
.chat-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#bbb;}
.chat-header{background:#fff;padding:.9rem 1.4rem;border-bottom:1px solid #EBEBEB;display:flex;align-items:center;gap:12px;}
.chat-messages{flex:1;overflow-y:auto;padding:1.2rem;display:flex;flex-direction:column;gap:.6rem;}
.msg{max-width:65%;padding:.6rem 1rem;border-radius:14px;font-size:.87rem;line-height:1.5;word-break:break-word;cursor:pointer;user-select:none;}
.msg.sent{background:var(--bk);color:#fff;border-bottom-right-radius:4px;align-self:flex-end;}
.msg.received{background:#fff;color:#333;border-bottom-left-radius:4px;align-self:flex-start;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.msg-time{font-size:.65rem;opacity:.6;margin-top:3px;text-align:right;}
.msg.received .msg-time{text-align:left;}
.chat-input-area{background:#fff;padding:.9rem 1.2rem;border-top:1px solid #EBEBEB;display:flex;gap:.6rem;align-items:center;}
.chat-input{flex:1;border:1.5px solid #E0E0E0;border-radius:24px;padding:.55rem 1.2rem;font-size:.88rem;outline:none;font-family:'Poppins',sans-serif;resize:none;}
.chat-input:focus{border-color:var(--y);}
.send-btn{width:42px;height:42px;background:var(--y);border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.2s;}
.send-btn:hover{background:var(--yd);}
.send-btn i{color:var(--bk);font-size:1rem;}

/* CONTEXT MENU */
.msg-context-menu{position:fixed;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.15);padding:.4rem 0;z-index:9999;min-width:160px;}
.msg-context-item{padding:.6rem 1.2rem;font-size:.85rem;cursor:pointer;display:flex;align-items:center;gap:8px;color:#333;}
.msg-context-item:hover{background:#F4F5F7;}
.msg-context-item.delete{color:#C62828;}

/* IMAGE PREVIEW */
.img-preview-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:flex-end;justify-content:center;}
.img-preview-box{background:#fff;border-radius:20px 20px 0 0;padding:1.2rem;width:100%;max-width:500px;}
.img-preview-box img{width:100%;max-height:300px;object-fit:contain;border-radius:12px;margin-bottom:1rem;}

/* REPLY QUOTE */
.reply-quote{background:rgba(255,255,255,.15);border-left:3px solid var(--y);padding:.3rem .6rem;border-radius:6px;font-size:.75rem;margin-bottom:4px;opacity:.85;}
.msg.received .reply-quote{background:rgba(0,0,0,.06);}
.reply-bar{background:#F4F5F7;border-left:3px solid var(--y);padding:.5rem 1rem;font-size:.82rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem;}

/* MOBILE */
@media (max-width: 768px) {
  .sidebar{transform:translateX(-100%);transition:transform 0.3s ease;position:fixed;z-index:300;}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:250;}
  .overlay.show{display:block;}
  .hamburger-btn{display:flex!important;}
  .contacts-panel{width:100%;}
  .chat-panel{display:none;}
  .chat-panel.mobile-show{display:flex;}
  .contacts-panel.mobile-hide{display:none;}
}
.hamburger-btn{display:none;}

.msg-wrapper{position:relative;display:flex;flex-direction:column;}
.msg-wrapper.sent{align-items:flex-end;}
.msg-wrapper.received{align-items:flex-start;}
.msg-actions{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;gap:6px;opacity:0;pointer-events:none;transition:opacity .2s;}
.msg-wrapper.sent .msg-actions{right:calc(100% + 8px);}
.msg-wrapper.received .msg-actions{left:calc(100% + 8px);}
.msg-action-btn{width:32px;height:32px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.85rem;}
.msg-action-reply{background:#E3F2FD;color:#1565C0;}
.msg-action-delete{background:#FFEBEE;color:#C62828;}
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- IMAGE PREVIEW OVERLAY -->
<div id="imgPreviewOverlay" class="img-preview-overlay" style="display:none">
  <div class="img-preview-box">
    <img id="imgPreviewImg" src="">
    <div class="d-flex gap-2">
      <button class="btn w-100" style="background:#F0F0F0;border:none;border-radius:10px;font-weight:600" onclick="cancelImagePreview()">Cancel</button>
      <button class="btn w-100" style="background:var(--y);color:var(--bk);font-weight:700;border:none;border-radius:10px;" onclick="confirmSendImage()">Send</button>
    </div>
  </div>
</div>

<aside class="sidebar">
  <div class="sb-header">
    <div class="sb-logo">A</div>
    <div><div class="sb-brand">Andik's Desserts</div><div class="sb-role" id="roleLabel">Staff Portal</div></div>
  </div>
  <nav style="padding:1rem 0;flex:1;overflow-y:auto">
    <div class="sb-label">Main</div>
    <a href="dashboard.html" class="sb-link" id="dashboardLink"><i class="bi bi-speedometer2"></i>Dashboard</a>
    <div class="sb-label">Menu</div>
    <a href="menu.html" class="sb-link" id="menuLink"><i class="bi bi-grid"></i>Menu Items</a>
    <div class="sb-label">Engagement</div>
    <a href="comments.html" class="sb-link" id="commentsLink"><i class="bi bi-chat-left-text"></i>Comments</a>
    <a href="staff-announcements2.html" class="sb-link" id="annLink"><i class="bi bi-megaphone"></i>Announcements</a>
    <div class="sb-label">Messages</div>
    <a href="chats.html" class="sb-link active"><i class="bi bi-chat-dots"></i>Chats <span class="sb-badge" id="sbUnreadBadge" style="display:none">0</span></a>
    <div id="adminLinks"></div>
  </nav>
  <div class="sb-footer">
    <button class="btn btn-sm w-100" style="background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);border:none;border-radius:8px;padding:.5rem" onclick="doLogout()">
      <i class="bi bi-box-arrow-right me-2"></i>Logout
    </button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <button class="hamburger-btn btn" style="background:none;border:none;color:var(--bk);font-size:1.4rem;padding:0;margin-right:.5rem" onclick="toggleSidebar()">
      <i class="bi bi-list"></i>
    </button>
    <div class="topbar-title">Chats</div>
    <div class="d-flex align-items-center gap-2">
      <div class="avatar" id="userAvatar">?</div>
      <div class="d-none d-md-block">
        <div style="font-weight:600;font-size:.85rem" id="userName"></div>
        <div style="font-size:.72rem;color:#999" id="userRole"></div>
      </div>
    </div>
  </div>

  <div class="chat-container">
    <!-- CONTACTS -->
    <div class="contacts-panel" id="contactsPanel">
      <div class="contacts-header">
        <h6 style="font-weight:700;margin-bottom:.6rem">Messages</h6>
        <input type="text" class="contacts-search" placeholder="Search contacts..." id="contactSearch" oninput="filterContacts()">
      </div>
      <div class="contacts-list" id="contactsList">
        <div class="text-center text-muted py-4" style="font-size:.85rem">Loading...</div>
      </div>
    </div>

    <!-- CHAT WINDOW -->
    <div class="chat-panel" id="chatPanel">
      <div class="chat-empty" id="chatEmpty">
        <i class="bi bi-chat-dots" style="font-size:3rem;margin-bottom:1rem;opacity:.3"></i>
        <p style="font-size:.9rem">Select a contact to start chatting</p>
      </div>
      <div id="chatWindow" style="display:none;flex:1;flex-direction:column;">
        <div class="chat-header" id="chatHeader"></div>
        <div id="replyBar" style="display:none" class="reply-bar">
          <div style="flex:1;min-width:0">
            <div style="font-size:.7rem;font-weight:700;color:var(--bk)">Replying to</div>
            <div id="replyBarText" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#555"></div>
          </div>
          <button onclick="cancelReply()" style="background:none;border:none;color:#999;font-size:1rem;padding:0"><i class="bi bi-x"></i></button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
          <label for="imageUpload" style="cursor:pointer;width:38px;height:38px;background:#F0F0F0;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <i class="bi bi-image" style="color:#666;font-size:1rem"></i>
          </label>
          <input type="file" id="imageUpload" accept="image/*" style="display:none" onchange="previewImage(this.files[0])">
          <textarea class="chat-input" id="chatInput" placeholder="Type a message..." rows="1" onkeydown="handleKey(event)"></textarea>
          <button class="send-btn" onclick="sendMessage()"><i class="bi bi-send-fill"></i></button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../phpdata/data.js"></script>
<script>
const BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? 'http://localhost/project'
  : 'https://aqua-wren-440584.hostingersite.com';

const CHAT_API = `${BASE}/phpdata`;

const urlParams = new URLSearchParams(window.location.search);
const userFromUrl = urlParams.get('u');
if (userFromUrl) {
  try {
    const userData = JSON.parse(decodeURIComponent(userFromUrl));
    localStorage.setItem("andiks_user", JSON.stringify(userData));
    window.history.replaceState({}, '', window.location.pathname);
  } catch(e) {}
}

const user = DB.currentUser();
if (!user || (user.role !== 'staff' && user.role !== 'admin')) {
  location.href = '../group-24/customer/login.html';
}

document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
document.getElementById('userName').textContent = user.name;
document.getElementById('userRole').textContent = user.role.charAt(0).toUpperCase() + user.role.slice(1);
document.getElementById('roleLabel').textContent = user.role === 'admin' ? 'Admin Portal' : 'Staff Portal';

if (user.role === 'admin') {
  document.getElementById('dashboardLink').href = '../admin/dashboard.html';
  document.getElementById('menuLink').href = '../staff/menu.html';
  document.getElementById('commentsLink').href = '../staff/comments.html';
  document.getElementById('annLink').href = '../staff/staff-announcements2.html';
  document.getElementById('adminLinks').innerHTML = `
    <div class="sb-label">Admin</div>
    <a href="../admin/dashboard.html" class="sb-link"><i class="bi bi-people"></i>Manage Staff</a>`;
} else {
  document.getElementById('dashboardLink').href = '../group-24/staff/dashboard.html';
  document.getElementById('menuLink').href = '../group-24/staff/menu.html';
  document.getElementById('commentsLink').href = '../group-24/staff/comments.html';
  document.getElementById('annLink').href = 'staff-announcements2.html';
}

let allContacts = [];
let activeContact = null;
let pollInterval = null;
let unreadPollInterval = null;

// ── CONTEXT MENU ──────────────────────────────────
let contextMsgId = null;
let contextIsSent = false;
let contextReplyText = null;
let replyingTo = null;
let longPressTimer = null;
let pendingImageFile = null;

function showMsgOptions(msgId, isSent, msgText, event) {
  event.preventDefault();
  contextMsgId = msgId;
  contextIsSent = isSent;
  contextReplyText = msgText;

  const existing = document.getElementById('msgContextMenu');
  if (existing) existing.remove();

  const menu = document.createElement('div');
  menu.id = 'msgContextMenu';
  menu.className = 'msg-context-menu';

  let items = `<div class="msg-context-item" onclick="replyToMsg()"><i class="bi bi-reply"></i>Reply</div>`;
  if (isSent) {
    items += `<div class="msg-context-item delete" onclick="deleteMessage(${msgId})"><i class="bi bi-trash"></i>Delete</div>`;
  }
  menu.innerHTML = items;

  const x = Math.min(event.clientX, window.innerWidth - 170);
  const y = Math.min(event.clientY, window.innerHeight - 100);
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';

  document.body.appendChild(menu);
  setTimeout(() => {
    document.addEventListener('click', closeContextMenu, { once: true });
  }, 10);
}

function closeContextMenu() {
  const menu = document.getElementById('msgContextMenu');
  if (menu) menu.remove();
}

function replyToMsg() {
  closeContextMenu();
  replyingTo = { id: contextMsgId, text: contextReplyText };
  document.getElementById('replyBarText').textContent = contextReplyText;
  document.getElementById('replyBar').style.display = 'flex';
  document.getElementById('chatInput').focus();
}

function cancelReply() {
  replyingTo = null;
  document.getElementById('replyBar').style.display = 'none';
}

function startLongPress(msgId, isSent, msgText, event) {
  longPressTimer = setTimeout(() => {
    const touch = event.touches[0];
    showMsgOptions(msgId, isSent, msgText, { preventDefault: () => {}, clientX: touch.clientX, clientY: touch.clientY });
  }, 600);
}

function cancelLongPress() {
  if (longPressTimer) {
    clearTimeout(longPressTimer);
    longPressTimer = null;
  }
}

// ── IMAGE PREVIEW ─────────────────────────────────
function previewImage(file) {
  if (!file) return;
  pendingImageFile = file;
  const url = URL.createObjectURL(file);
  document.getElementById('imgPreviewImg').src = url;
  document.getElementById('imgPreviewOverlay').style.display = 'flex';
}

function cancelImagePreview() {
  pendingImageFile = null;
  document.getElementById('imgPreviewOverlay').style.display = 'none';
  document.getElementById('imageUpload').value = '';
}

async function confirmSendImage() {
  if (!pendingImageFile || !activeContact) return;
  document.getElementById('imgPreviewOverlay').style.display = 'none';

  const container = document.getElementById('chatMessages');
  const previewId = 'preview_' + Date.now();
  const localUrl = URL.createObjectURL(pendingImageFile);
  container.innerHTML += `
    <div id="${previewId}" style="display:flex;flex-direction:column;align-items:flex-end">
      <div class="msg sent" style="opacity:.6">
        <img src="${localUrl}" style="max-width:200px;border-radius:8px;display:block">
        <div class="msg-time">Sending...</div>
      </div>
    </div>`;
  container.scrollTop = container.scrollHeight;

  const formData = new FormData();
  formData.append('image', pendingImageFile);

  try {
    const res = await fetch(`${BASE}/phpdata/upload_chat_image.php`, { method: 'POST', body: formData });
    const data = await res.json();
    if (data.success) {
      await fetch(`${CHAT_API}/send_message.php`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender_id: user.id, receiver_id: activeContact.id, message: data.url })
      });
      document.getElementById(previewId)?.remove();
      loadMessages();
    }
  } catch (err) {
    console.error('sendImage error:', err);
    document.getElementById(previewId)?.remove();
  }

  pendingImageFile = null;
  document.getElementById('imageUpload').value = '';
}

// ── CONTACTS ──────────────────────────────────────
async function loadContacts() {
  try {
    const res = await fetch(`${CHAT_API}/get_chat_users.php?user_id=${user.id}&role=${user.role}`, {
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    });
    allContacts = await res.json();
    renderContacts(allContacts);
  } catch (err) {
    console.error('loadContacts error:', err);
  }
}

function renderContacts(contacts) {
  const list = document.getElementById('contactsList');
  if (!contacts.length) {
    list.innerHTML = '<div class="text-center text-muted py-4" style="font-size:.85rem">No contacts yet</div>';
    return;
  }
  list.innerHTML = contacts.map(c => `
    <div class="contact-item ${activeContact?.id == c.id ? 'active' : ''}" onclick="openChat(${c.id}, '${c.name}', '${c.role}')">
      <div class="contact-av ${c.role === 'admin' ? 'admin' : ''}">${c.name.charAt(0).toUpperCase()}</div>
      <div class="contact-info">
        <div class="d-flex align-items-center gap-1">
          <span class="contact-name">${c.name}</span>
          <span class="role-tag ${c.role}">${c.role}</span>
        </div>
        <div class="contact-preview">${c.last_message || 'No messages yet'}</div>
      </div>
      <div class="contact-meta">
        <span class="contact-time">${c.last_message_time ? formatTime(c.last_message_time) : ''}</span>
        ${c.unread_count > 0 ? `<span class="unread-badge">${c.unread_count}</span>` : ''}
      </div>
    </div>
  `).join('');
}

function filterContacts() {
  const search = document.getElementById('contactSearch').value.toLowerCase();
  renderContacts(allContacts.filter(c => c.name.toLowerCase().includes(search)));
}

function formatTime(datetime) {
  if (!datetime) return '';
  const d = new Date(datetime);
  const now = new Date();
  const diff = now - d;
  if (diff < 86400000) return d.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit', hour12:false});
  return d.toLocaleDateString('en-US', {day:'numeric', month:'short'});
}

// ── OPEN CHAT ─────────────────────────────────────
async function openChat(contactId, contactName, contactRole) {
  if (activeContact?.id == contactId) return; // dah open, skip
  if (pollInterval) clearInterval(pollInterval);
  
  activeContact = { id: contactId, name: contactName, role: contactRole };
  lastMessagesHash = '';
  document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('active'));
  event.currentTarget.classList.add('active');

  // Clear messages instantly untuk nampak responsive
    document.getElementById('chatMessages').innerHTML = '';

  document.getElementById('chatEmpty').style.display = 'none';
  const chatWindow = document.getElementById('chatWindow');
  chatWindow.style.display = 'flex';
  chatWindow.style.flexDirection = 'column';
  chatWindow.style.flex = '1';

  document.getElementById('chatHeader').innerHTML = `
    <button class="btn d-md-none" style="background:none;border:none;color:var(--bk);font-size:1.2rem;padding:0;margin-right:.5rem" onclick="backToContacts()">
      <i class="bi bi-arrow-left"></i>
    </button>
    <div class="contact-av ${contactRole === 'admin' ? 'admin' : ''}" style="width:38px;height:38px;font-size:.9rem">${contactName.charAt(0).toUpperCase()}</div>
    <div>
      <div style="font-weight:700;font-size:.9rem">${contactName}</div>
      <div class="role-tag ${contactRole}" style="display:inline-block">${contactRole}</div>
    </div>
  `;

  document.getElementById('contactsPanel').classList.add('mobile-hide');
  document.getElementById('chatPanel').classList.add('mobile-show');

  await loadMessages();

  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(loadMessages, 5000);
}

// ── MESSAGES ──────────────────────────────────────
let lastMessagesHash = '';

async function loadMessages() {
  if (!activeContact) return;
  try {
    const res = await fetch(`${CHAT_API}/get_messages.php?user_id=${user.id}&other_id=${activeContact.id}`, {
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    });
    const messages = await res.json();
    const hash = messages.map(m => m.id + m.message).join('');
    if (hash === lastMessagesHash) return; // tak berubah, skip render
    lastMessagesHash = hash;
    renderMessages(messages);
    loadContacts();
  } catch (err) {
    console.error('loadMessages error:', err);
  }
}

function renderMessages(messages) {
  const container = document.getElementById('chatMessages');
  const wasAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 50;

  container.innerHTML = messages.map(m => {
    const isSent = m.sender_id == user.id;
    const isImage = m.message && m.message.startsWith('/uploads/chat/');
    const msgText = isImage ? '[Image]' : (m.message || '').replace(/`/g, '').substring(0, 60);
    const safeText = msgText.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

    // Check if message has reply quote (starts with "> ")
    let displayMsg = '';
    if (!isImage && m.message && m.message.startsWith('> ')) {
      const lines = m.message.split('\n');
      const quoteLine = lines[0].replace('> ', '');
      const restLines = lines.slice(1).join('\n');
      displayMsg = `<div class="reply-quote">${quoteLine}</div>${restLines}`;
    } else if (isImage) {
      displayMsg = `<img src="${m.message}" style="max-width:200px;border-radius:8px;display:block" onerror="this.src='https://placehold.co/200x150?text=Image'">`;
    } else {
      displayMsg = m.message;
    }

    return `
  <div style="display:flex;flex-direction:column;align-items:${isSent ? 'flex-end' : 'flex-start'}">
    ${!isSent ? `<div style="font-size:.68rem;color:#999;margin-bottom:2px;padding-left:4px">${m.sender_name}</div>` : ''}
    <div style="display:flex;align-items:center;gap:6px;${isSent ? 'flex-direction:row-reverse' : ''}">
      <div class="msg ${isSent ? 'sent' : 'received'}">
        ${displayMsg}
        <div class="msg-time">${formatTime(m.created_at)}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <button onclick="replyToMsgById(${m.id}, '${safeText}')" style="width:28px;height:28px;background:#E3F2FD;color:#1565C0;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;cursor:pointer"><i class="bi bi-reply"></i></button>
        ${isSent ? `<button onclick="deleteMessage(${m.id})" style="width:28px;height:28px;background:#FFEBEE;color:#C62828;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;cursor:pointer"><i class="bi bi-trash"></i></button>` : ''}
      </div>
    </div>
  </div>
`;
  }).join('');

  if (wasAtBottom || messages.length < 5) {
    container.scrollTop = container.scrollHeight;
  }
}

// ── SEND MESSAGE ──────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('chatInput');
  let message = input.value.trim();
  if (!message || !activeContact) return;

  if (replyingTo) {
    message = `> ${replyingTo.text}\n${message}`;
    cancelReply();
  }

  input.value = '';

  // Optimistic UI — terus append message tanpa tunggu server
  const container = document.getElementById('chatMessages');
  const tempId = 'temp_' + Date.now();
  const tempDiv = document.createElement('div');
  tempDiv.id = tempId;
  tempDiv.style.cssText = 'display:flex;flex-direction:column;align-items:flex-end';
  tempDiv.innerHTML = `
    <div class="msg sent" style="opacity:.7">
      ${message.startsWith('> ') ? (() => {
        const lines = message.split('\n');
        return `<div class="reply-quote">${lines[0].replace('> ','')}</div>${lines.slice(1).join('\n')}`;
      })() : message}
      <div class="msg-time">Sending...</div>
    </div>`;
  container.appendChild(tempDiv);
  container.scrollTop = container.scrollHeight;

  try {
    await fetch(`${CHAT_API}/send_message.php`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
      body: JSON.stringify({ sender_id: user.id, receiver_id: activeContact.id, message })
    });
    lastMessagesHash = ''; // force refresh
    loadMessages();
  } catch (err) {
    console.error('sendMessage error:', err);
    document.getElementById(tempId)?.remove();
  }
}

function deleteMessage(msgId) {
  closeContextMenu();
  
  const existing = document.getElementById('deleteConfirmToast');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.id = 'deleteConfirmToast';
  toast.style.cssText = `position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:.6rem 1rem;border-radius:12px;z-index:9999;display:flex;align-items:center;gap:10px;font-size:.82rem;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2)`;
  toast.innerHTML = `
    <span>Delete this message?</span>
    <button onclick="confirmDeleteMsg(${msgId})" style="background:#C62828;color:#fff;border:none;border-radius:8px;padding:3px 10px;font-size:.78rem;cursor:pointer;font-weight:600">Delete</button>
    <button onclick="document.getElementById('deleteConfirmToast').remove()" style="background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:3px 10px;font-size:.78rem;cursor:pointer">Cancel</button>
  `;
  document.body.appendChild(toast);

  setTimeout(() => {
    document.getElementById('deleteConfirmToast')?.remove();
  }, 4000);
}

async function confirmDeleteMsg(msgId) {
  document.getElementById('deleteConfirmToast')?.remove();
  try {
    await fetch(`${CHAT_API}/delete_message.php`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: msgId, user_id: user.id })
    });
    loadMessages();
  } catch (err) {
    console.error('deleteMessage error:', err);
  }
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// ── UNREAD BADGE ──────────────────────────────────
async function checkUnread() {
  try {
    const res = await fetch(`${CHAT_API}/get_unread.php?user_id=${user.id}`, {
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    });
    const data = await res.json();
    const badge = document.getElementById('sbUnreadBadge');
    if (data.total > 0) {
      badge.style.display = '';
      badge.textContent = data.total;
    } else {
      badge.style.display = 'none';
    }
  } catch (err) {}
}

function doLogout() {
  DB.logout();
  location.href = '../group-24/customer/login.html';
}

function toggleSidebar() {
  document.querySelector('.sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function backToContacts() {
  document.getElementById('contactsPanel').classList.remove('mobile-hide');
  document.getElementById('chatPanel').classList.remove('mobile-show');
  if (pollInterval) clearInterval(pollInterval);
  activeContact = null;
  cancelReply();
}


let touchStartX = 0;
let touchStartY = 0;
let swipedMsg = null;

function handleTouchStart(e, el) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  swipedMsg = el;
  isHorizontalSwipe = false;
}

let isHorizontalSwipe = false;

function handleTouchMove(e, el) {
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  
  if (!isHorizontalSwipe && Math.abs(dy) > Math.abs(dx)) return;
  if (Math.abs(dx) > 10) isHorizontalSwipe = true;
  
  if (isHorizontalSwipe && dx < 0) {
    e.preventDefault();
    el.style.transition = 'none';
    el.style.transform = `translateX(${Math.max(dx, -80)}px)`;
  }
}

function handleTouchEnd(e, el) {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const msgId = el.dataset.id;
  const actions = document.getElementById('actions_' + msgId);
  
  el.style.transition = 'transform .2s';
  
  if (isHorizontalSwipe && dx < -40) {
    el.style.transform = 'translateX(-80px)';
    if (actions) { 
      actions.style.opacity = '1'; 
      actions.style.pointerEvents = 'auto'; 
    }
  } else {
    el.style.transform = 'translateX(0)';
    if (actions) { 
      actions.style.opacity = '0'; 
      actions.style.pointerEvents = 'none'; 
    }
  }
  isHorizontalSwipe = false;
}

function replyToMsgById(id, text) {
  replyingTo = { id, text };
  document.getElementById('replyBarText').textContent = text;
  document.getElementById('replyBar').style.display = 'flex';
  document.getElementById('chatInput').focus();
}


document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (pollInterval) clearInterval(pollInterval);
    if (unreadPollInterval) clearInterval(unreadPollInterval);
  } else {
    if (activeContact) {
      lastMessagesHash = '';
      loadMessages();
      pollInterval = setInterval(loadMessages, 5000);
    }
    unreadPollInterval = setInterval(checkUnread, 5000);
  }
});

// Init
loadContacts();
checkUnread();
unreadPollInterval = setInterval(checkUnread, 5000);
</script>
